<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradient for the back line (Blue) -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Gradient for the front line (Vibrant Pink to Purple) -->
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5576c" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>

    <!-- Subtle drop shadow to give the X depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Optional dark background (Remove this line for a transparent background) -->
  <rect width="500" height="500" rx="100" fill="#1a1a2e" />

  <!-- Back Line (Top-Left to Bottom-Right) -->
  <line x1="150" y1="150" x2="350" y2="350" stroke="url(#grad1)" stroke-width="75" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Front Line (Bottom-Left to Top-Right) -->
  <line x1="150" y1="350" x2="350" y2="150" stroke="url(#grad2)" stroke-width="75" stroke-linecap="round" filter="url(#shadow)" />
</svg>
